<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#e81824">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>泡澡球集點</title>
<style>
  :root {
    --red:#ef202d;
    --red2:#c70f1e;
    --blue:#1769d2;
    --blue2:#0c50b4;
    --yellow:#ffca28;
    --ink:#14213d;
    --muted:#6b7280;
    --card:#ffffff;
    --line:#dfe7f0;
    --sky:#9bd8ff;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:#eef4fa;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif}
  body{min-height:100%;padding:0 0 28px}
  .app{width:min(100%,820px);margin:0 auto;background:#eef4fa}
  .hero{position:relative;overflow:hidden;background:linear-gradient(180deg,#169cf2,#55c4ff);border-bottom:8px solid var(--red)}
  .hero img{display:block;width:100%;height:auto;aspect-ratio:988/358;object-fit:contain;object-position:center}
  .hero:after{content:"";position:absolute;inset:auto 0 0;height:50px;background:linear-gradient(0deg,rgba(0,0,0,.08),transparent)}
  .rule{position:absolute;right:16px;top:14px;background:rgba(255,255,255,.95);border:4px solid #fff;border-radius:22px;padding:8px 12px;display:flex;align-items:center;gap:8px;font-weight:900;font-size:clamp(18px,4vw,28px);box-shadow:0 5px 0 rgba(0,0,0,.08)}
  .ball-mini{width:34px;height:34px;border-radius:50%;background:linear-gradient(#dff2ff 0 50%,#f21f2d 50%);border:3px solid #fff;box-shadow:inset 0 0 0 2px rgba(0,0,0,.12)}
  .tub-mini{font-size:30px}
  .main{padding:14px}
  .panel{background:#fff;border:1px solid var(--line);border-radius:26px;box-shadow:0 8px 24px rgba(23,50,89,.08);overflow:hidden}
  .progress{padding:18px 16px 16px;margin-top:-2px}
  .score-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .score-wrap{display:flex;align-items:center;gap:10px}
  .star{font-size:34px;filter:drop-shadow(0 2px 0 #8a6500)}
  .score{font-weight:1000;letter-spacing:-1px;white-space:nowrap}
  .score .n{font-size:50px;color:var(--blue)}
  .score .d{font-size:28px;color:#3a4660}
  .reward-count{display:flex;align-items:center;gap:7px;font-weight:900;background:#eef6ff;border:2px solid #d9eaff;border-radius:16px;padding:9px 11px;white-space:nowrap}
  .reward-count span:first-child{font-size:25px}
  .slots{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-top:14px}
  .slot{aspect-ratio:1;border-radius:50%;border:2px dashed #9aa5b1;background:#eef1f4;position:relative;overflow:hidden}
  .slot.filled{border-style:solid;border-color:#d7e4ef;background:linear-gradient(#dff3ff 0 49%,#ef2431 50% 100%);box-shadow:inset 0 0 0 2px #fff,0 3px 0 rgba(0,0,0,.08)}
  .slot.filled:before{content:"";position:absolute;width:34%;height:18%;border-radius:50%;background:rgba(255,255,255,.8);top:15%;left:18%;transform:rotate(-24deg)}
  .activities{display:grid;gap:12px;margin-top:14px}
  .activity{display:grid;grid-template-columns:minmax(120px,1.15fr) minmax(130px,.85fr);gap:12px;align-items:center;padding:12px}
  .scene{position:relative;border-radius:20px;overflow:hidden;min-height:145px;background:#dceaf5}
  .scene img{width:100%;height:100%;position:absolute;inset:0;object-fit:cover}
  .scene-badge{position:absolute;left:10px;bottom:10px;background:rgba(255,255,255,.9);border-radius:14px;padding:6px 9px;font-weight:1000;font-size:20px;box-shadow:0 3px 0 rgba(0,0,0,.08)}
  .control{display:flex;flex-direction:column;gap:10px;align-items:stretch}
  .counter{font-size:54px;font-weight:1000;line-height:1;text-align:center;background:#f0f4f8;border:2px solid #e2e8f0;border-radius:18px;padding:12px}
  .buttons{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  button{border:0;min-height:52px;border-radius:17px;font-size:30px;font-weight:1000;color:#fff;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.12)}
  button:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.12)}
  .minus{background:linear-gradient(#2377e6,#0c58c5)}
  .plus{background:linear-gradient(#ff3946,#dd101f)}
  .rate{display:flex;justify-content:center;align-items:center;gap:6px;font-weight:1000;color:#3e485a;font-size:20px}
  .bath-card{margin-top:14px;position:relative;overflow:hidden;min-height:250px;background:#caecff}
  .bath-card img{display:block;width:100%;height:260px;object-fit:cover;object-position:center 50%}
  .bath-overlay{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center;padding:16px;background:linear-gradient(transparent 55%,rgba(0,0,0,.2))}
  .hint{background:rgba(255,255,255,.94);border-radius:999px;padding:8px 15px;font-weight:900;box-shadow:0 3px 0 rgba(0,0,0,.08)}
  .tiny{font-size:12px;color:var(--muted);text-align:center;padding:14px 8px 2px}
  .reset{display:block;margin:12px auto 0;background:#fff;color:#5f6b7a;border:1px solid #d7dee7;box-shadow:none;font-size:15px;min-height:42px;padding:0 18px}
  .reset:active{transform:none}

  .success{position:fixed;inset:0;background:rgba(8,20,38,.78);z-index:20;display:none;align-items:center;justify-content:center;padding:18px}
  .success.show{display:flex}
  .success-card{width:min(100%,620px);background:#fff;border-radius:28px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.4);position:relative}
  .success-visual{position:relative;height:min(64vh,620px);min-height:430px;background:#bfe9ff;overflow:hidden}
  .success-visual img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center}
  .success-top{position:absolute;left:0;right:0;top:12px;text-align:center;font-size:44px;font-weight:1000;color:#fff;text-shadow:0 3px 0 #8a5b00;z-index:4}
  .drop-ball{position:absolute;z-index:5;width:82px;height:82px;border-radius:50%;left:50%;top:18%;transform:translateX(-50%);background:linear-gradient(#e2f5ff 0 50%,#ed1f2d 50%);border:5px solid #fff;box-shadow:0 8px 14px rgba(0,0,0,.22);animation:drop 1.2s cubic-bezier(.25,.75,.3,1) forwards}
  .splash{position:absolute;z-index:4;left:50%;bottom:18%;transform:translateX(-50%) scale(.2);font-size:86px;opacity:0;animation:splash .45s ease-out .88s forwards}
  .confetti{position:absolute;inset:0;pointer-events:none;z-index:6;overflow:hidden}
  .confetti i{position:absolute;top:-20px;width:10px;height:18px;border-radius:2px;animation:fall 2.6s linear infinite}
  .success-actions{padding:14px}
  .claim{width:100%;background:linear-gradient(#ff3946,#dd101f);font-size:22px}
  .subnote{text-align:center;margin-top:9px;font-size:13px;color:#6b7280}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:#152238;color:#fff;padding:10px 14px;border-radius:999px;font-weight:800;opacity:0;pointer-events:none;transition:.2s;z-index:40}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  @keyframes drop{0%{top:16%;transform:translateX(-50%) rotate(-20deg)}75%{top:64%;transform:translateX(-50%) rotate(320deg)}100%{top:68%;transform:translateX(-50%) rotate(360deg) scale(.92)}}
  @keyframes splash{to{opacity:1;transform:translateX(-50%) scale(1)}}
  @keyframes fall{to{transform:translateY(680px) rotate(720deg)}}
  @media (max-width:560px){
    .main{padding:10px}
    .activity{grid-template-columns:1.15fr .85fr;padding:9px;gap:9px}
    .scene{min-height:132px}
    .counter{font-size:46px;padding:10px}
    button{min-height:48px}
    .rate{font-size:17px}
    .score .n{font-size:46px}
    .slots{gap:4px}
  }
  @media (min-width:700px){
    .activities{grid-template-columns:1fr 1fr}
    .activity{grid-template-columns:1fr;align-content:start}
    .scene{min-height:210px}
    .bath-card img{height:340px}
  }
  @media (prefers-reduced-motion:reduce){
    *,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important}
  }
</style>
</head>

  const $ = s => document.querySelector(s);
  const scoreEl = $('#score');
  const rewardsEl = $('#rewards');
  const schoolEl = $('#schoolCount');
  const sleepEl = $('#sleepCount');
  const slotsEl = $('#slots');
  const successEl = $('#success');
  const toastEl = $('#toast');
  const confettiEl = $('#confetti');

  function load(){
    try {
      const raw = localStorage.getItem(KEY);
      if (!raw) return {...defaultState};
      const p = JSON.parse(raw);
      return {
        school: clampInt(p.school,0,99),
        sleep: clampInt(p.sleep,0,99),
        rewards: clampInt(p.rewards,0,999),
        celebrated: !!p.celebrated
      };
    } catch(e) {
      return {...defaultState};
    }
  }
  function clampInt(v,min,max){
    v = Number.isFinite(+v) ? Math.floor(+v) : 0;
    return Math.min(max,Math.max(min,v));
  }
  function points(){
    return Math.floor(state.school/2) + state.sleep;
  }
  function save(){
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e) {}
    showToast('已儲存');
  }
  let toastTimer;
  function showToast(t){
    toastEl.textContent=t;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer=setTimeout(()=>toastEl.classList.remove('show'),900);
  }
  function render(){
    const p = Math.min(5, points());
    scoreEl.textContent = p;
    rewardsEl.textContent = state.rewards;
    schoolEl.textContent = state.school;
    sleepEl.textContent = state.sleep;
    slotsEl.innerHTML='';
    for(let i=0;i<5;i++){
      const s=document.createElement('div');
      s.className='slot'+(i<p?' filled':'');
      slotsEl.appendChild(s);
    }
    if(points() >= 5){
      if(!state.celebrated){
        state.celebrated=true;
        save();
      }
      celebrate();
    } else {
      successEl.classList.remove('show');
    }
  }
  function celebrate(){
    if(successEl.classList.contains('show')) return;
    confettiEl.innerHTML='';
    const colors=['#ffca28','#ef202d','#1769d2','#2bc56f','#ffffff'];
    for(let i=0;i<34;i++){
      const c=document.createElement('i');
      c.style.left=(Math.random()*100)+'%';
      c.style.background=colors[i%colors.length];
      c.style.animationDelay=(Math.random()*0.8)+'s';
      c.style.animationDuration=(1.8+Math.random()*1.2)+'s';
      confettiEl.appendChild(c);
    }
    successEl.classList.add('show');
  }
  function add(which, delta){
    state[which] = clampInt(state[which] + delta, 0, 99);
    if(points() < 5) state.celebrated=false;
    save();
    render();
  }

  document.querySelectorAll('[data-action]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const a=btn.dataset.action;
      if(a==='school-plus') add('school',1);
      if(a==='school-minus') add('school',-1);
      if(a==='sleep-plus') add('sleep',1);
      if(a==='sleep-minus') add('sleep',-1);
    });
  });

  $('#claimBtn').addEventListener('click',()=>{
    if(points() < 5){
      successEl.classList.remove('show');
      return;
    }
    state.rewards += 1;
    state.school = 0;
    state.sleep = 0;
    state.celebrated = false;
    save();
    successEl.classList.remove('show');
    render();
    showToast('泡澡球 +1');
  });

  $('#resetBtn').addEventListener('click',()=>{
    if(confirm('確定要把目前次數、點數和泡澡球紀錄全部清除嗎？')){
      state={...defaultState};
      try{localStorage.removeItem(KEY)}catch(e){}
      render();
      showToast('已重新開始');
    }
  });

  render();
})();
</script>
</body>
</html>
